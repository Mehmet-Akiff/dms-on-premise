server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Vue SPA routing desteği
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API isteklerini proxy'le
    location /api/ {
        proxy_pass http://backend:3000/api/;

        # Proxy Header'ları (CORS ve istemci bilgisi)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Büyük dosya yüklemeleri (multipart/form-data)
        client_max_body_size 50M;

        # Uzun süren AI işlemleri için timeout ayarları
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Proxy buffer ayarları (büyük yanıtlar için)
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # Yüklenen dosyaları backend üzerinden sunmak için proxy
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statik dosyalar için cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
