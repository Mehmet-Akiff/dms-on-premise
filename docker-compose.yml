# ============================================================
# DMS On-Premise - Docker Compose Yapılandırması
# Servisler: frontend, backend, ai-service, db
# Ağ: dms-network (bridge, izole)
# ============================================================

services:
  # --------------------------------------------------------
  # 1. FRONTEND - Vue 3 (Vite) + Nginx
  # Host'a açık tek port: 80
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dms-frontend:latest
    container_name: dms_frontend
    ports:
      - "80:80"
    networks:
      - dms-network
    depends_on:
      - backend
    restart: unless-stopped

  # --------------------------------------------------------
  # 2. BACKEND - Node.js (Express)
  # Dış dünyaya kapalıdır, sadece Nginx proxy üzerinden erişilir.
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dms-backend:latest
    container_name: dms_backend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - CISO_DEFAULT_PASSWORD=${CISO_DEFAULT_PASSWORD}
      - KASA_DEFAULT_PASSWORD=${KASA_DEFAULT_PASSWORD}
    volumes:
      - upload-data:/app/uploads
    networks:
      - dms-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  # --------------------------------------------------------
  # 3. AI SERVICE - Python (FastAPI + Tesseract + SpaCy)
  # Dış dünyaya kapalıdır, sadece backend üzerinden erişilir.
  # --------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: dms-ai-service:latest
    container_name: dms_ai_service
    expose:
      - "8000"
    environment:
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/4.00/tessdata
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    volumes:
      - upload-data:/app/shared-uploads
    networks:
      - dms-network
    depends_on:
      - db
    restart: unless-stopped

  # --------------------------------------------------------
  # 4. DATABASE - PostgreSQL 15
  # Dış dünyaya kapalıdır, sadece iç ağdan erişilebilir.
  # --------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: dms_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - dms-network
    restart: always

# ============================================================
# AĞ TANIMI (Network Definition)
# ============================================================
networks:
  dms-network:
    driver: bridge

# ============================================================
# KALICI DİSK ALANLARI (Named Volumes)
# ============================================================
volumes:
  pg-data:
    driver: local
  upload-data:
    driver: local
